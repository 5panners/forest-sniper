<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Droid Gunner</title>
<style>
html,body{margin:0;height:100%;background:#1b2420;overflow:hidden;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#dfe7df}
canvas{display:block}
#ui{position:fixed;left:12px;bottom:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#ui button{background:#27332c;color:#e6efe6;border:1px solid #4b5f52;border-radius:6px;padding:7px 11px;font:inherit;cursor:pointer}
#ui button:hover{background:#34453a}
#say{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:18px;background:#0d1411cc;border:1px solid #3c4d43;font-size:18px;letter-spacing:.06em;min-width:120px;text-align:center;transition:opacity .4s}
#hint{position:fixed;top:14px;left:14px;color:#9fb0a4;font-size:12px;max-width:260px}
</style></head><body>
<div id="say" style="opacity:0">&nbsp;</div>
<div id="hint"><b>DROID GUNNER</b> · drag = orbit · wheel = zoom<br>WASD drive · Space jump · F fire<br>1-8 talk</div>
<div id="ui"></div>
<script src="three187.min.js"></script>
<script>
const T=THREE;T.ColorManagement.enabled=false;
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.outputColorSpace=T.SRGBColorSpace;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0xb9cdd6);scene.fog=new T.Fog(0xb9cdd6,30,120);
const camera=new T.PerspectiveCamera(42,1,0.1,400);
const hemi=new T.HemisphereLight(0xdfe9f2,0x4f5536,0.55*Math.PI);scene.add(hemi);
const sun=new T.DirectionalLight(0xfff0d6,0.95*Math.PI);sun.position.set(6,10,4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:30});sun.shadow.bias=-0.0002;sun.shadow.normalBias=0.02;scene.add(sun);scene.add(sun.target);
const M=(c,o)=>new T.MeshStandardMaterial(Object.assign({color:c,flatShading:true,roughness:0.72,metalness:0.18},o||{}));
const MAT={olive:M(0x5c6a3e),olive2:M(0x4a5632),tan:M(0x9c8a5c),dark:M(0x2a2d2e,{metalness:0.35}),steel:M(0x6b7174,{metalness:0.5,roughness:0.5}),tire:M(0x1d1d1c,{roughness:0.95,metalness:0}),
 red:M(0xb23a2a),brass:M(0xc9a23a,{metalness:0.7,roughness:0.35}),copper:M(0x8a4a2a,{metalness:0.6}),white:M(0xe8ece6),glassD:M(0x10161a,{metalness:0.6,roughness:0.25}),rubber:M(0x262626,{roughness:1,metalness:0})};
const add=(p,g,m,x,y,z)=>{const o=new T.Mesh(g,m);o.position.set(x||0,y||0,z||0);o.castShadow=true;o.receiveShadow=true;p.add(o);return o;};
const box=(p,w,h,d,m,x,y,z)=>add(p,new T.BoxGeometry(w,h,d),m,x,y,z);
const cyl=(p,rt,rb,h,seg,m,x,y,z)=>add(p,new T.CylinderGeometry(rt,rb,h,seg),m,x,y,z);

/* ---------------- ground ---------------- */
const gh=(x,z)=>0.045*Math.sin(x*0.9+0.4)*Math.cos(z*0.7)+0.03*Math.sin(x*0.31+z*0.43);
{const g=new T.PlaneGeometry(240,240,120,120).rotateX(-Math.PI/2);const p=g.attributes.position,col=[];const c1=new T.Color(0x3f5a2c),c2=new T.Color(0x57532f);
 for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);p.setY(i,gh(x,z));const k=(Math.sin(x*0.5)*Math.cos(z*0.4)+1)/2;const c=c1.clone().lerp(c2,k*0.7);col.push(c.r,c.g,c.b);}
 g.setAttribute('color',new T.Float32BufferAttribute(col,3));const gm=new T.Mesh(g.toNonIndexed(),new T.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1,metalness:0}));gm.geometry.computeVertexNormals();gm.receiveShadow=true;scene.add(gm);
 for(let i=0;i<40;i++){const a=Math.random()*6.28,r=5+Math.random()*30,s=0.2+Math.random()*0.7;const rk=new T.Mesh(new T.IcosahedronGeometry(s,0),M(0x7a7a72));rk.position.set(Math.cos(a)*r,gh(Math.cos(a)*r,Math.sin(a)*r)+s*0.3,Math.sin(a)*r);rk.scale.y=0.6;rk.rotation.y=Math.random()*3;rk.castShadow=rk.receiveShadow=true;scene.add(rk);}}

/* ---------------- the droid ---------------- */
const R=0.5,WW=0.30;               // wheel radius / width
const root=new T.Group();scene.add(root);
const wheelAsm=new T.Group();root.add(wheelAsm);            // pivots about the ground contact point so it can lean in turns
const axle=new T.Group();axle.position.y=R;wheelAsm.add(axle);
const wheel=new T.Group();axle.add(wheel);
{ // tyre
  const tire=add(wheel,new T.CylinderGeometry(R,R,WW,22).rotateZ(Math.PI/2),MAT.tire);
  for(let i=0;i<22;i++){const a=i/22*Math.PI*2;const l=box(wheel,WW*1.04,0.055,0.11,MAT.rubber,0,Math.sin(a)*(R+0.012),Math.cos(a)*(R+0.012));l.rotation.x=-a;}   // tread blocks: you can see it roll
  for(const s of [-1,1]){cyl(wheel,R*0.66,R*0.66,0.04,18,MAT.steel,0,0,0).rotation.z=Math.PI/2;const rim=cyl(wheel,R*0.64,R*0.64,0.02,18,MAT.tan,s*(WW/2+0.0),0,0);rim.rotation.z=Math.PI/2;
    for(let i=0;i<6;i++){const a=i/6*Math.PI*2;const sp=box(wheel,0.03,0.05,R*0.54,MAT.dark,s*(WW/2+0.012),Math.sin(a)*R*0.29,Math.cos(a)*R*0.29);sp.rotation.x=-a+Math.PI/2;}
    const hub=cyl(wheel,0.085,0.085,0.05,8,MAT.red,s*(WW/2+0.03),0,0);hub.rotation.z=Math.PI/2;
    // a red marker lug on each rim so the roll reads
    box(wheel,0.025,0.07,0.07,MAT.red,s*(WW/2+0.014),0,R*0.52);}
}
// swing-arm fork + axle
for(const s of [-1,1]){box(axle,0.045,0.62,0.2,MAT.steel,s*0.205,0.28,0);box(axle,0.07,0.07,0.07,MAT.dark,s*0.205,0,0);}
cyl(axle,0.03,0.03,0.5,8,MAT.dark,0,0,0).rotation.z=Math.PI/2;
box(axle,0.5,0.05,0.12,MAT.steel,0,0.58,0);      // fork bridge above the tyre
const chassis=new T.Group();root.add(chassis);                // everything that rides on the suspension (origin at axle height)
const hull=new T.Group();chassis.add(hull);
// lower hull + fender skirts
box(hull,0.62,0.34,0.66,MAT.olive,0,0.80,0);box(hull,0.54,0.1,0.58,MAT.olive2,0,0.60,0);
for(const s of [-1,1]){box(hull,0.05,0.42,0.5,MAT.olive2,s*0.315,0.50,0);box(hull,0.05,0.14,0.34,MAT.dark,s*0.34,0.42,0);}
box(hull,0.66,0.06,0.5,MAT.dark,0,0.985,0.02);
// chevron armour on the front, red stripe
box(hull,0.5,0.20,0.04,MAT.tan,0,0.80,0.345);box(hull,0.5,0.045,0.045,MAT.red,0,0.70,0.35);
for(const s of [-1,1]){const c=box(hull,0.28,0.05,0.045,MAT.olive2,s*0.14,0.84,0.37);c.rotation.z=s*-0.5;}
// belly lights and status LEDs
const LED=[];for(let i=0;i<3;i++){const l=box(hull,0.05,0.025,0.02,M(0x333333,{emissive:0x000000}),-0.12+i*0.12,0.93,0.352);LED.push(l);}
// shoulder deck, pylon, ammo box
box(hull,1.02,0.07,0.34,MAT.olive,0,1.04,-0.02);
for(const s of [-1,1]){box(hull,0.16,0.09,0.22,MAT.dark,s*0.55,1.03,0.02);}      // gun yokes
box(hull,0.34,0.10,0.30,MAT.dark,0,1.12,-0.12);
const ammo=new T.Group();ammo.position.set(0,1.3,-0.14);hull.add(ammo);
box(ammo,0.44,0.24,0.34,MAT.olive2,0,0,0);box(ammo,0.46,0.035,0.36,MAT.dark,0,0.12,0);box(ammo,0.1,0.05,0.12,MAT.tan,0,0.15,0.0);   // lid + handle
for(const s of [-1,1]){box(ammo,0.03,0.1,0.2,MAT.dark,s*0.225,-0.02,0);}
box(ammo,0.3,0.06,0.02,MAT.red,0,0,-0.175);
// antenna with a status bulb
cyl(hull,0.008,0.012,0.34,5,MAT.dark,-0.2,1.55,-0.2);const bulb=add(hull,new T.IcosahedronGeometry(0.022,0),M(0xff7a2a,{emissive:0xff5a10,emissiveIntensity:1.4}),-0.2,1.73,-0.2);
// exhaust / vents at the back
for(let i=0;i<3;i++)box(hull,0.4,0.02,0.02,MAT.dark,0,0.72+i*0.07,-0.335);

/* ---------- suspension: two coil-over shocks, drawn between the fork and the hull ---------- */
const SHOCK=[];
for(const s of [-1,1]){const g=new T.Group();root.add(g);const rod=cyl(g,0.014,0.014,1,6,MAT.steel,0,0.5,0),tube=cyl(g,0.026,0.026,1,8,MAT.dark,0,0.5,0);
  const rings=[];for(let i=0;i<9;i++){const r=add(g,new T.TorusGeometry(0.04,0.0095,4,9).rotateX(Math.PI/2),MAT.red,0,0,0);rings.push(r);}
  SHOCK.push({s,g,rod,tube,rings});}
function shockStep(){
  chassis.updateMatrix();wheelAsm.updateMatrix();
  for(const k of SHOCK){const pl=new T.Vector3(k.s*0.40,0.30+R,0).applyMatrix4(wheelAsm.matrix);const pu=new T.Vector3(k.s*0.40,0.98,0).applyMatrix4(chassis.matrix);
    // keep the lower mount on the fork; the top mount rides on the hull deck
    const d=pu.clone().sub(pl);const L=d.length();k.g.position.copy(pl);k.g.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());
    k.rod.scale.y=L*0.5;k.rod.position.y=L*0.25;k.tube.scale.y=L*0.5;k.tube.position.y=L*0.75;
    k.rings.forEach((r,i)=>{r.position.y=L*(0.1+i*0.1);r.scale.set(1,Math.min(1.5,0.17/ (L/10)),1);});}
  // brackets (static look) handled by shocks themselves
}

/* ---------- twin AR-15s ---------- */
function buildAR(side){const g=new T.Group();
  box(g,0.05,0.07,0.28,MAT.dark,0,0,0.0);box(g,0.052,0.05,0.2,MAT.dark,0,-0.058,-0.03);              // receivers
  box(g,0.028,0.022,0.46,MAT.steel,0,0.05,0.15);box(g,0.04,0.045,0.07,MAT.dark,0,0.07,-0.02);       // top rail + carry-handle block
  box(g,0.05,0.055,0.3,MAT.steel,0,0.005,0.29);box(g,0.056,0.016,0.28,MAT.dark,0,0.04,0.29);box(g,0.056,0.016,0.28,MAT.dark,0,-0.03,0.29);   // handguard with heat-shield strips
  cyl(g,0.011,0.011,0.32,6,MAT.dark,0,0.005,0.6).rotation.x=Math.PI/2;                              // barrel
  cyl(g,0.021,0.016,0.075,6,MAT.dark,0,0.005,0.79).rotation.x=Math.PI/2;                             // flash hider
  box(g,0.01,0.05,0.01,MAT.dark,0,0.045,0.56);                                                       // front sight
  box(g,0.034,0.1,0.045,MAT.dark,0,-0.12,-0.1).rotation.x=0.3;                                       // pistol grip
  box(g,0.04,0.055,0.08,MAT.dark,0,-0.11,0.05);                                                      // magwell block (belt-fed, no magazine)
  const tray=box(g,0.08,0.05,0.13,MAT.steel,-side*0.062,0.0,0.02);box(g,0.03,0.035,0.05,MAT.brass,-side*0.11,0.0,0.02);   // feed tray toward the ammo box
  box(g,0.01,0.03,0.07,M(0x0f0f0f),side*0.027,0.012,0.05);                                           // ejection port
  const flash=new T.Group();flash.position.set(0,0.005,0.84);flash.visible=false;g.add(flash);
  const fm=new T.MeshBasicMaterial({color:0xffc060,transparent:true,opacity:0.95,blending:T.AdditiveBlending,depthWrite:false});
  const f1=new T.Mesh(new T.ConeGeometry(0.05,0.28,7,1,true).rotateX(Math.PI/2).translate(0,0,0.14),fm);flash.add(f1);
  const f2=new T.Mesh(new T.ConeGeometry(0.02,0.18,5,1,true).rotateX(Math.PI/2).translate(0,0,0.09),new T.MeshBasicMaterial({color:0xfff6d0,transparent:true,opacity:1,blending:T.AdditiveBlending,depthWrite:false}));flash.add(f2);
  const fl=new T.PointLight(0xffa850,0,6,2);flash.add(fl);
  g.userData={flash,fl};return g;}
const GUNS=[];
for(const s of [-1,1]){const pivot=new T.Group();pivot.position.set(s*0.56,1.13,0.02);hull.add(pivot);const gun=buildAR(s);gun.position.z=-0.1;pivot.add(gun);GUNS.push({s,pivot,gun,rec:0});}

/* ---------- chain-fed ammo belts ---------- */
const BELT=[];
for(const s of [-1,1]){
  const curve=new T.CatmullRomCurve3([new T.Vector3(s*0.18,1.30,-0.14),new T.Vector3(s*0.30,1.34,-0.06),new T.Vector3(s*0.42,1.26,0.01),new T.Vector3(s*0.50,1.17,0.0),new T.Vector3(s*0.535,1.135,-0.06)]);
  const len=curve.getLength(),sp=0.036,N=Math.round(len/sp);
  const cg=new T.CylinderGeometry(0.0125,0.0125,0.05,6).rotateZ(Math.PI/2),bg=new T.ConeGeometry(0.0115,0.045,6).rotateZ(-s*Math.PI/2).translate(s*-0.0,0,0);
  bg.translate(0,0,0);bg.translate(-s*0.0,0,0);bg.translate(s*-0.0,0,0);
  const casing=new T.InstancedMesh(cg,MAT.brass,N),tip=new T.InstancedMesh(new T.ConeGeometry(0.0115,0.04,6).rotateZ(Math.PI/2).translate(0.045,0,0),MAT.copper,N);
  const link=new T.InstancedMesh(new T.BoxGeometry(0.075,0.012,0.012),MAT.steel,N);
  casing.castShadow=tip.castShadow=true;hull.add(casing);hull.add(tip);hull.add(link);BELT.push({s,curve,len,N,casing,tip,link,feed:0});}
const _m=new T.Matrix4(),_q=new T.Quaternion(),_v=new T.Vector3(),_t=new T.Vector3(),_u=new T.Vector3(0,1,0),_x=new T.Vector3(),_zv=new T.Vector3(),_yv=new T.Vector3();
function beltStep(){for(const b of BELT){for(let i=0;i<b.N;i++){const u=((i/b.N)+b.feed)%1;b.curve.getPointAt(u,_v);b.curve.getTangentAt(u,_t);
    _zv.copy(_t).normalize();_x.copy(_u).cross(_zv).normalize();_yv.copy(_zv).cross(_x);_m.makeBasis(_x,_yv,_zv);_m.setPosition(_v);
    // the links hang with the casings lying across the belt: x axis across
    const mm=_m.clone();b.casing.setMatrixAt(i,mm);b.tip.setMatrixAt(i,mm);b.link.setMatrixAt(i,mm);}
    b.casing.instanceMatrix.needsUpdate=b.tip.instanceMatrix.needsUpdate=b.link.instanceMatrix.needsUpdate=true;}}

/* ---------- the eyes: telescoping stalks with lidded lenses ---------- */
const EYES=[];
for(const s of [-1,1]){
  const base=new T.Group();base.position.set(s*0.12,1.43,0.06);hull.add(base);
  cyl(base,0.055,0.065,0.05,8,MAT.dark,0,0.0,0);
  const sp=new T.Group();base.add(sp);                                             // stalk pivot (pitch/yaw)
  const segs=[0.034,0.028,0.022].map((r,i)=>cyl(sp,r,r,1,8,i===1?MAT.steel:MAT.dark,0,0,0));
  const head=new T.Group();sp.add(head);
  const hs=add(head,new T.IcosahedronGeometry(0.092,1),MAT.glassD,0,0,0);
  const lensMat=new T.MeshStandardMaterial({color:0x35e0ff,emissive:0x35e0ff,emissiveIntensity:1.6,flatShading:true,roughness:0.3});
  const lens=add(head,new T.CircleGeometry(0.062,14),lensMat,0,0,0.082);lens.castShadow=false;
  const ring=add(head,new T.RingGeometry(0.062,0.076,14),MAT.steel,0,0,0.0815);ring.castShadow=false;
  const pupil=add(head,new T.CircleGeometry(0.026,10),new T.MeshBasicMaterial({color:0x050a0c}),0,0,0.0835);pupil.castShadow=false;
  const glint=add(head,new T.CircleGeometry(0.009,6),new T.MeshBasicMaterial({color:0xffffff}),0.018,0.02,0.0845);glint.castShadow=false;
  const lidPivot=new T.Group();head.add(lidPivot);const lid=add(lidPivot,new T.SphereGeometry(0.1,12,6,0,Math.PI*2,0,Math.PI/2),MAT.olive,0,0,0);
  EYES.push({s,base,sp,segs,head,lens,lensMat,pupil,glint,lidPivot,lid,ext:0.4,lidA:0.1,tilt:0,pitch:0,yaw:0,look:new T.Vector2()});
}

/* ---------------- state + animation ---------------- */
const D={t:0,x:0,z:0,yaw:0,v:0,vT:0,yawRate:0,yawT:0,roll:0,ang:0,
  hJ:0,vJ:0,crouch:0,air:false,s:0,sv:0,pr:0,prv:0,rl:0,rlv:0,lastY:0,lastVy:0,wy:0,wvy:0,
  mood:'neutral',moodT:0,fire:false,fireT:0,shot:0,auto:true,keys:{},col:new T.Color(0x35e0ff),colT:new T.Color(0x35e0ff),
  P:{ext:[0.4,0.4],lid:[0.1,0.1],tilt:[0,0],pitch:0,yawShake:0,bob:0,bobF:0,wig:0,look:0,hop:0}};
const MOODS={
 neutral:{ext:[0.45,0.45],lid:[0.15,0.15],tilt:[0,0],col:0x35e0ff,bob:0.02,bobF:1.2,look:0.5},
 hi:     {ext:[1,1],lid:[-0.3,-0.3],tilt:[0,0],col:0x6dffb0,bob:0.1,bobF:5,wig:0.35,look:0.2},
 yes:    {ext:[0.7,0.7],lid:[-0.1,-0.1],tilt:[0,0],col:0x5dff6a,bob:0.35,bobF:7,look:0},
 no:     {ext:[0.4,0.4],lid:[0.8,0.8],tilt:[-0.4,0.4],col:0xff3b2e,yawShake:0.45,bobF:10,look:0},
 excited:{ext:[1,1],lid:[-0.35,-0.35],tilt:[0,0],col:0xffd23a,bob:0.18,bobF:10,wig:0.3,hop:1,look:0.4},
 alert:  {ext:[0.65,0.65],lid:[0.95,0.95],tilt:[-0.55,0.55],col:0xff5a1a,bob:0,look:0.1},
 sad:    {ext:[0.05,0.05],lid:[0.75,0.75],tilt:[0.45,-0.45],col:0x4a7bff,bob:0.06,bobF:0.8,look:0},
 curious:{ext:[0.95,0.55],lid:[-0.15,0.4],tilt:[0.0,-0.3],col:0xb67bff,bob:0.05,bobF:2,look:1}};
const LAND=0.0;
function setMood(n,hold){D.mood=n;D.moodT=hold||0;const m=MOODS[n];D.colT.set(m.col);
  if(n==='excited'&&!D.air&&D.hJ<0.01)jump(0.8);if(n==='hi'||n==='yes')D.vT*=1;}
function jump(k){if(D.air||D.crouch>0)return;D.crouch=0.2;D.jk=k||1;}
function stepSim(dt){
  D.t+=dt;const K=D.keys;
  if(D.auto&&!K.w&&!K.s&&!K.a&&!K.d){D.vT=D.wander?1.6+1.0*Math.sin(D.t*0.4):0;D.yawT=D.wander?0.5*Math.sin(D.t*0.23):0;}
  else{D.vT=(K.w?2.6:0)-(K.s?1.6:0);D.yawT=(K.d?-1:0)+(K.a?1:0);D.yawT*=0.9;}
  const a=(D.vT-D.v)*3.2;D.v+=a*dt;D.yawRate+=(D.yawT-D.yawRate)*Math.min(1,dt*4);D.yaw+=D.yawRate*dt;
  D.x+=Math.sin(D.yaw)*D.v*dt;D.z+=Math.cos(D.yaw)*D.v*dt;
  // jump: crouch (suspension compresses), launch, ballistic, land
  if(D.crouch>0){D.crouch-=dt;D.s+=(-0.1-D.s)*Math.min(1,dt*14);if(D.crouch<=0){D.vJ=4.3*Math.sqrt(D.jk||1);D.air=true;}}
  if(D.air){D.vJ-=9.8*dt;D.hJ+=D.vJ*dt;if(D.hJ<=0&&D.vJ<0){D.hJ=0;D.air=false;D.vJ=0;D.landed=1;}}
  const gy=gh(D.x,D.z);const wy=gy+D.hJ;D.wvy=(wy-D.wy)/Math.max(dt,1e-4);const wa=(D.wvy-D.lastVy)/Math.max(dt,1e-4);D.lastVy=D.wvy;D.wy=wy;
  const acc=Math.max(-40,Math.min(40,wa));
  // soft suspension: spring + damper, driven by the wheel's vertical acceleration; landing slams it into the bump stop gently
  if(!(D.crouch>0)){const k=70,c=7.5;D.sv+=(-k*D.s-c*D.sv-acc*(D.air?0.0:1))*dt;if(D.air){D.sv+=(0.0)*dt;}D.s+=D.sv*dt;}
  if(D.s<-0.14){D.s=-0.14;if(D.sv<0)D.sv*=-0.3;}if(D.s>0.1){D.s=0.1;if(D.sv>0)D.sv*=-0.3;}
  if(D.air){D.s+=(0.07-D.s)*Math.min(1,dt*3);}
  // pitch: lean back on accel, forward on braking; roll: chassis leans out of the turn while the wheel leans in
  const pt=-a*0.022-(D.fire?0.012:0);D.prv+=(-60*(D.pr-pt)-8*D.prv)*dt;D.pr+=D.prv*dt;
  const lat=D.v*D.yawRate,lean=Math.atan(lat/9.8)*0.9;D.roll+=(lean-D.roll)*Math.min(1,dt*6);
  const rt=lean*0.35;D.rlv+=(-60*(D.rl-rt)-8*D.rlv)*dt;D.rl+=D.rlv*dt;
  D.ang+=D.v/R*dt;   // no-slip rolling: angle = distance / radius
  // mood
  const m=MOODS[D.mood],P=D.P;const k=Math.min(1,dt*8);
  for(let i=0;i<2;i++){P.ext[i]+=(m.ext[i]-P.ext[i])*k;P.lid[i]+=(m.lid[i]-P.lid[i])*k;P.tilt[i]+=(m.tilt[i]-P.tilt[i])*k;}
  P.bob+=((m.bob||0)-P.bob)*k;P.bobF+=((m.bobF||1)-P.bobF)*k;P.yawShake+=((m.yawShake||0)-P.yawShake)*k;P.wig+=((m.wig||0)-P.wig)*k;P.look+=((m.look||0)-P.look)*k;
  D.col.lerp(D.colT,Math.min(1,dt*7));
  if(D.moodT>0){D.moodT-=dt;if(D.moodT<=0)setMood('neutral');}
  // blink
  D.blinkT=(D.blinkT==null?2:D.blinkT)-dt;if(D.blinkT<0&&D.mood!=='no'&&D.mood!=='alert'){D.blink=0.14;D.blinkT=2+Math.random()*3.5;}D.blink=Math.max(0,(D.blink||0)-dt);
  // firing: alternate barrels, feed the belts, kick the hull
  if(D.fire){D.fireT-=dt;while(D.fireT<=0){D.fireT+=1/14;const g=GUNS[D.shot++%2];g.flashT=0.045;g.rec=0.035;D.prv-=0.35;const b=BELT[g.s<0?0:1];b.feed=(b.feed+b.curve.getLength()>0?(b.feed+0.036/b.len*2)%1:0);}}
  for(const g of GUNS){g.flashT=Math.max(0,(g.flashT||0)-dt);const ud=g.gun.userData;ud.flash.visible=g.flashT>0;ud.fl.intensity=g.flashT>0?9:0;ud.flash.rotation.z=Math.random()*6;ud.flash.scale.setScalar(0.8+Math.random()*0.5);g.rec*=Math.pow(0.0005,dt);g.gun.position.z=-0.1-g.rec;}
  // body motion
  const hop=P.bob*Math.abs(Math.sin(D.t*P.bobF*2))*0.5;
  root.position.set(D.x,0,D.z);root.rotation.y=D.yaw;
  wheelAsm.position.y=wy;wheelAsm.rotation.z=-D.roll;
  wheel.rotation.x=D.ang;
  chassis.position.set(0,wy+R+D.s+0,0);chassis.rotation.set(D.pr,0,D.rl+D.roll*0.0);
  if(D.mood==='no')chassis.rotation.y=Math.sin(D.t*14)*0.12*Math.exp(-((D.moodElapsed||0)*0.0));else chassis.rotation.y*=0.8;
  chassis.updateMatrix();
  // eyes
  const tmp=new T.Vector3();
  EYES.forEach((e,i)=>{const side=e.s,ext=P.ext[i]+P.wig*0.3*Math.sin(D.t*9+i*2.2);const L=0.06+0.2*Math.max(0,ext);
    e.segs.forEach((sg,j)=>{sg.scale.y=L/3;sg.position.y=L/3*(j+0.5);});e.head.position.y=L+0.05;
    const nod=P.bob*Math.sin(D.t*P.bobF*2)*(D.mood==='yes'?1.2:0.3);
    e.sp.rotation.x=(D.mood==='sad'?0.5:0)+nod-(D.mood==='alert'?0.15:0);
    e.sp.rotation.y=P.yawShake*Math.sin(D.t*P.bobF*2)*1.1+P.look*Math.sin(D.t*0.8+i*0.7)*0.4;
    e.sp.rotation.z=-side*0.12-(D.mood==='sad'?side*0.25:0)+side*(P.wig?0.18*Math.sin(D.t*9):0);
    const lidA=P.lid[i]+(D.blink>0?1.5*Math.sin(Math.min(1,D.blink/0.14)*Math.PI):0);e.lidPivot.rotation.z=P.tilt[i]*side*-1*0+ (i===0?P.tilt[0]:P.tilt[1]);e.lid.rotation.x=Math.max(-0.35,Math.min(Math.PI/2,lidA));
    e.lensMat.color.copy(D.col);e.lensMat.emissive.copy(D.col);e.lensMat.emissiveIntensity=1.3+0.5*Math.sin(D.t*(D.mood==='excited'?22:3));
    const lx=Math.sin(D.t*1.3+i)*0.02*P.look*2,ly=Math.cos(D.t*0.9+i*2)*0.012*P.look*2;e.pupil.position.set(lx,ly,0.0835);e.glint.position.set(0.018+lx,0.02+ly,0.0845);});
  bulb.material.emissiveIntensity=1.0+0.8*Math.sin(D.t*4);bulb.material.emissive.copy(D.col);bulb.material.color.copy(D.col);
  LED.forEach((l,i)=>{l.material.emissive.copy(D.col);l.material.emissiveIntensity=(0.7+0.7*Math.sin(D.t*5+i*1.3))>0.9?1.4:0.1;l.material.color.copy(D.col).multiplyScalar(0.4);});
  shockStep();beltStep();
}
/* ---------------- camera ---------------- */
const CAM={az:0.7,el:0.22,dist:5.2,tx:0,ty:1.0,tz:0,follow:true};
function camStep(){const px=D.x,pz=D.z;if(CAM.follow){CAM.tx+=(px-CAM.tx)*0.12;CAM.tz+=(pz-CAM.tz)*0.12;}
  camera.position.set(CAM.tx+Math.sin(CAM.az)*Math.cos(CAM.el)*CAM.dist,CAM.ty+Math.sin(CAM.el)*CAM.dist,CAM.tz+Math.cos(CAM.az)*Math.cos(CAM.el)*CAM.dist);camera.lookAt(CAM.tx,CAM.ty,CAM.tz);
  sun.position.set(CAM.tx+6,10,CAM.tz+4);sun.target.position.set(CAM.tx,0,CAM.tz);}
let drag=null;renderer.domElement.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];});addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{if(!drag)return;CAM.az-=(e.clientX-drag[0])*0.006;CAM.el=Math.max(-0.1,Math.min(1.3,CAM.el+(e.clientY-drag[1])*0.005));drag=[e.clientX,e.clientY];});
addEventListener('wheel',e=>{CAM.dist=Math.max(1.8,Math.min(14,CAM.dist*(1+Math.sign(e.deltaY)*0.08)));},{passive:true});
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();

/* ---------------- voice: a small beep-boop language ---------------- */
let AC=null;const sayEl=document.getElementById('say');let sayTO=0;
const WORDS={ // [startHz, endHz, ms, wave, gain]
 hi:     {txt:'bi-DEEP-boo!',mood:'hi',   seq:[[620,980,110,'triangle'],[1180,900,150,'triangle'],[760,1250,140,'sine']]},
 yes:    {txt:'bip-BOOP!',   mood:'yes',  seq:[[520,640,90,'square',0.5],[700,1200,170,'triangle']]},
 no:     {txt:'bwoh-bwoh.',  mood:'no',   seq:[[420,260,190,'sawtooth',0.5],[300,170,260,'sawtooth',0.5]]},
 excited:{txt:'bibibi-WEEEE!',mood:'excited',seq:[[600,800,60,'square',0.4],[800,1000,60,'square',0.4],[1000,1300,60,'square',0.4],[1300,1700,60,'square',0.4],[1500,2000,120,'triangle'],[1900,1500,60,'triangle'],[1600,2100,260,'triangle',1,18]]},
 alert:  {txt:'EEP! EEP!',   mood:'alert',seq:[[900,880,120,'sawtooth',0.5],[600,590,120,'sawtooth',0.5],[900,880,120,'sawtooth',0.5],[600,590,160,'sawtooth',0.5]]},
 sad:    {txt:'bwooooo…',    mood:'sad',  seq:[[620,540,160,'sine'],[540,300,520,'sine',1,6],[290,190,420,'sine']]},
 curious:{txt:'brrr-eh?',    mood:'curious',seq:[[380,420,110,'triangle',1,24],[420,980,300,'sine',1,8]]},
 thanks: {txt:'dee-doo!',    mood:'yes',  seq:[[900,700,110,'triangle'],[700,1000,200,'sine']]}};
function say(w,pitch){const W=WORDS[w];if(!W)return;setMood(W.mood,0.9+W.seq.length*0.18);
  sayEl.textContent='“'+W.txt+'”';sayEl.style.opacity=1;clearTimeout(sayTO);sayTO=setTimeout(()=>sayEl.style.opacity=0,1800);
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}}if(AC.state==='suspended')AC.resume();
  const pm=(pitch||1)*(0.96+Math.random()*0.08);let t=AC.currentTime+0.02;
  const out=AC.createGain();out.gain.value=0.18;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4200;out.connect(lp);lp.connect(AC.destination);
  for(const [f0,f1,ms,wave,g,vib] of W.seq){const o=AC.createOscillator();o.type=wave;const len=ms/1000;o.frequency.setValueAtTime(f0*pm,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,f1*pm),t+len);
    const gg=AC.createGain();gg.gain.setValueAtTime(0,t);gg.gain.linearRampToValueAtTime(g==null?1:g,t+0.012);gg.gain.setTargetAtTime(0,t+len*0.7,len*0.12);
    if(vib){const l=AC.createOscillator();l.frequency.value=vib;const lg=AC.createGain();lg.gain.value=f0*0.06;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+len+0.1);}
    o.connect(gg);gg.connect(out);o.start(t);o.stop(t+len+0.1);t+=len*0.92;}}
const BTN=[['Hi','hi'],['Yes','yes'],['No','no'],['Excited','excited'],['Alert','alert'],['Sad','sad'],['Curious','curious'],['Thanks','thanks']];
const ui=document.getElementById('ui');BTN.forEach(([l,w],i)=>{const b=document.createElement('button');b.textContent=(i+1)+' '+l;b.onclick=()=>say(w);ui.appendChild(b);});
for(const [l,f] of [['Jump',()=>jump(1)],['Fire (hold)',null],['Wander',()=>{D.wander=!D.wander;}]]){const b=document.createElement('button');b.textContent=l;if(f)b.onclick=f;else{b.onpointerdown=()=>D.fire=true;b.onpointerup=b.onpointerleave=()=>D.fire=false;}ui.appendChild(b);}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if('wasd'.includes(k)&&k.length===1){D.keys[k]=true;}if(k===' '){jump(1);e.preventDefault();}if(k==='f')D.fire=true;if(k>='1'&&k<='8')say(BTN[+k-1][1]);});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();D.keys[k]=false;if(k==='f')D.fire=false;});
D.wander=true;
let last=performance.now();function loop(now){const dt=Math.min(0.033,(now-last)/1000);last=now;if(!window.__still){stepSim(dt);}camStep();renderer.render(scene,camera);requestAnimationFrame(loop);}
stepSim(0.016);requestAnimationFrame(loop);
window.D=D;window.CAM=CAM;window.say=say;window.setMood=setMood;window.jump=jump;window.stepSim=stepSim;window.camStep=camStep;window.renderer=renderer;window.scene=scene;window.camera=camera;
</script></body></html>
